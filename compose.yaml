services:
    web:
      container_name: web_test_idx
      image: webdevops/php-apache-dev:8.3
      working_dir: /app
      environment:
        WEB_DOCUMENT_ROOT: /app/public
        PHP_DISPLAY_ERRORS: 1
      ports:
        - "8000:80"
      volumes:
        - .:/app
      depends_on:
        - database

    database:
      image: mysql:8.0
      container_name: database_test_idx
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: app
        MYSQL_USER: app
        MYSQL_PASSWORD: app
      ports:
        - "3307:3306"
      volumes:
        - database_data:/var/lib/mysql

    phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: phpmyadmin_test_idx
      restart: unless-stopped
      environment:
        PMA_HOST: database
        PMA_PORT: 3306
      ports:
        - "8001:80"
      depends_on:
        - database

    mailer:
      image: axllent/mailpit
      ports:
        - "1025:1025"
        - "8025:8025"
      environment:
        MP_SMTP_AUTH_ACCEPT_ANY: 1
        MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
